<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Glass KC · A collection in light</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      main {
        height: 100%;
        box-sizing: border-box;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 2%;
        padding: 5% 3% 4%;
        align-items: center;
      }
      .window {
        min-width: 0;
      }
      .window:first-child {
        transform: translateY(-2%) rotate(-3deg);
      }
      .window:last-child {
        transform: translateY(3%) rotate(3deg);
      }
      svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .rotating-window {
        display: grid;
      }
      .window-scene {
        grid-area: 1 / 1;
        min-width: 0;
        opacity: 0;
        transition: opacity 900ms ease;
      }
      .window-scene.is-current {
        opacity: 1;
      }
      @media (prefers-reduced-motion: reduce) {
        .window-scene {
          transition: none;
        }
      }
    </style>
    <script src="bosses/catalog.js?v=raid-modes-2" defer></script>
    <script src="bosses/glass-window.js?v=raid-modes-1" defer></script>
    <script src="bosses/toa-art.js?v=approved-motion-1" defer></script>
    <script src="bosses/cg-art.js?v=motion-refinements-1" defer></script>
    <script src="bosses/cox-art.js?v=bow-motion-2" defer></script>
    <script src="bosses/pnm-art.js?v=approved-motion-1" defer></script>
    <script src="featured.js?v=continuous-motion-1" defer></script>
  </head>
  <body>
    <main aria-label="Two animated windows from the Glass KC collection">
      <div id="shadow-window" class="window"></div>
      <div class="window rotating-window">
        <div id="prif-window" class="window-scene is-current"></div>
        <div id="sleepwalkers-window" class="window-scene" aria-hidden="true"></div>
        <div id="zebak-window" class="window-scene" aria-hidden="true"></div>
        <div id="olm-window" class="window-scene" aria-hidden="true"></div>
      </div>
    </main>
  </body>
</html>
