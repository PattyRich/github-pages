<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Glass KC · Window gallery</title>
    <link rel="stylesheet" href="gallery.css" />
    <link rel="stylesheet" href="window-workshop.css?v=frames-2" />
    <script src="bosses/catalog.js?v=maiden-matomenos-1" defer></script>
    <script src="bosses/glass-window.js?v=frames-2" defer></script>
    <script src="window-workshop.js?v=frames-2" defer></script>
    <script src="bosses/pnm-art.js?v=nightmare-totems-1" defer></script>
    <script src="bosses/cox-art.js?v=chambers-purple-2" defer></script>
    <script src="bosses/toa-art.js?v=wardens-2" defer></script>
    <script src="bosses/tob-art.js?v=maiden-matomenos-1" defer></script>
    <script src="bosses/cg-art.js?v=labyrinth-rune-3" defer></script>
    <script src="gallery.js" defer></script>
  </head>
  <body>
    <main class="gallery-shell">
      <header class="gallery-heading">
        <p class="eyebrow">Glass KC · Window gallery</p>
        <div class="heading-row">
          <h1>All the windows.</h1>
          <p id="gallery-count" class="muted"></p>
        </div>
        <p>Every scene, fully lit. Choose a shape and frame for each window.</p>
      </header>
      <div class="gallery-toolbar">
        <nav id="collection-links" aria-label="Jump to a boss collection"></nav>
        <div class="edition-control">
          <label for="glass-edition">Glass edition</label>
          <select id="glass-edition"></select>
        </div>
      </div>
      <div id="window-workshop"></div>
      <div id="collections"></div>
      <noscript><p>Enable JavaScript to see the stained-glass windows.</p></noscript>
    </main>
    <dialog id="window-viewer" aria-labelledby="viewer-title" aria-describedby="viewer-description">
      <header class="viewer-heading">
        <div>
          <p id="viewer-collection" class="muted"></p>
          <h2 id="viewer-title"></h2>
        </div>
        <div class="viewer-actions">
          <button id="viewer-zoom" type="button" aria-pressed="false">Zoom in</button>
          <button id="viewer-close" type="button" aria-label="Close larger window" autofocus>
            Close ✕
          </button>
        </div>
      </header>
      <div id="viewer-art"></div>
      <p id="viewer-description"></p>
      <div id="viewer-workshop"></div>
      <footer class="viewer-controls">
        <button id="viewer-previous" type="button">← Previous</button>
        <span id="viewer-position" class="muted" aria-live="polite"></span>
        <button id="viewer-next" type="button">Next →</button>
      </footer>
    </dialog>
  </body>
</html>
