name: Deploy Backend

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
    paths:
      - 'services/api/**'
      - 'docker-compose.prod.yml'
      - '.dockerignore'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Update Backend Containers
        uses: appleboy/ssh-action@v1.0.3
        env:
          RELEASE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_KEY }}
          envs: RELEASE_SHA
          command_timeout: 40m
          script: |
            set -e
            exec 9>/var/www/server/github-pages/.git/praynr-deploy.lock
            flock -w 1200 9
            cd /var/www/server/github-pages
            
            git fetch origin main
            git cat-file -e "$RELEASE_SHA^{commit}"
            revision_file="$(git rev-parse --git-path praynr-backend-revision)"
            deployed_sha="$(cat "$revision_file" 2>/dev/null || true)"
            if [ -n "$deployed_sha" ] && [ "$deployed_sha" != "$RELEASE_SHA" ] && git merge-base --is-ancestor "$RELEASE_SHA" "$deployed_sha"; then
              echo "Skipping a backend release superseded by $deployed_sha."
              exit 0
            fi
            git reset --hard "$RELEASE_SHA"

            docker compose -f docker-compose.prod.yml config --quiet
            docker compose -f docker-compose.prod.yml build --pull api worker
            docker compose -f docker-compose.prod.yml up -d --no-deps api worker
            printf '%s\n' "$RELEASE_SHA" > "$revision_file"

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_DEPLOY_WEBHOOK is not set; skipping Discord notification."
            exit 0
          fi

          curl -fsS -H "Content-Type: application/json" \
            -d "{\"content\":\"<@197140022569205762> ${WORKFLOW_NAME} failed: ${RUN_URL}\"}" \
            "$DISCORD_WEBHOOK"
