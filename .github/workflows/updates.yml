name: Weekly Container Maintenance

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly at midnight Sunday UTC
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  update-images:
    runs-on: ubuntu-latest
    steps:
      - name: Pull and Update Third-Party Images
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_KEY }}
          command_timeout: 40m
          script: |
            set -e
            exec 9>/var/www/server/github-pages/.git/praynr-deploy.lock
            flock -w 1200 9
            cd /var/www/server/github-pages
            # Pull latest third-party images.
            docker compose -f docker-compose.prod.yml pull mongo redis dozzle
            
            # Custom images are rebuilt by their SHA-pinned deployment workflows.
            # The shared checkout may belong to a different product's release.
            docker compose -f docker-compose.prod.yml up -d --no-deps mongo redis dozzle
            # Optional: Clean up old images to save disk space
            docker image prune -f
